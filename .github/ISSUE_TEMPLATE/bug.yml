name: Bug report
description: Report a defect in the scaffold, validator, or documentation.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: For example config, validator, CI, or docs.
    validations:
      required: true
  - type: input
    id: hermes
    attributes:
      label: Hermes Agent version
      description: Only when the report concerns upstream behavior.
    validations:
      required: false
